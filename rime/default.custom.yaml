# 全域自訂：覆蓋 rime-ice 的 default.yaml
# 基底：iDvel/rime-ice 99662ba (2026-10-31)
patch:
  schema_list:
    - schema: double_pinyin_flypy   # 小鶴雙拼，排第一 = 預設方案
    - schema: rime_ice              # 霧凇全拼備用
  menu/page_size: 7
  # 取消 Caps Lock / Shift / Control 切換中英文；Caps Lock 恢復為系統原生大寫鎖定
  ascii_composer/good_old_caps_lock: true
  ascii_composer/switch_key:
    Caps_Lock: noop
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
    Eisu_toggle: noop
  # 簡繁切換改為單擊 Shift（見 lua/shift_trad_toggle.lua），釋放被其他程式佔用的 Ctrl+Shift+4。
  # patch 無法刪除列表項，所以把原本的兩條簡繁綁定（第 8、9 項）覆寫成已存在的無害綁定。
  # 注意：索引對應上面的基底版本，更新 rime-ice 後若 key_binder/bindings 順序有變需重新核對。
  key_binder/bindings/@8: { when: composing, accept: Tab, send: Shift+Right }
  key_binder/bindings/@9: { when: composing, accept: Tab, send: Shift+Right }
